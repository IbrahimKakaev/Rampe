# Serves the Angular application and forwards /api to the API, so that the
# browser talks to a single origin.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # Security headers are set per location below: the API sets its own, and
  # nginx must not add a second, conflicting copy to its answers.

  # In production, Caddy stands in front and passes the client address in
  # X-Forwarded-For: the API rate-limits by that address. It is taken only from
  # a request that comes from a container network, where only Caddy is.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  # Docker's internal DNS. Resolving at request time, through a variable, lets
  # nginx start before the API and follow it when its address changes.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # File names carry a content hash: they can be cached for good.
  location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Every other path is a route of the single-page application.
  # The content policy allows only the application's own files: no inline
  # script (the build inserts none) and no inline style (components declare
  # no styles of their own; everything is in the global stylesheet).
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}
