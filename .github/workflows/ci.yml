name: CI

# Runs on every push. Pull requests from the same repository are covered by the
# push of their branch, so they do not trigger a second run.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit; the comment gives the release.
jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Unit tests (packages/rules must stay at 100 % coverage)
        run: pnpm test
      - name: Integration tests against real PostgreSQL and Valkey
        run: pnpm test:integration
      - run: pnpm build

  dependencies:
    name: Dependency audit and licences
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities (high and critical fail the build)
        run: pnpm audit --audit-level high
      - name: Licences (no GPL, no AGPL, nothing unknown)
        run: pnpm licenses:check

  e2e:
    name: Docker Compose and end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the application exactly as a fresh clone does
        run: docker compose up --build --detach --wait
      - name: Install the test browser
        run: pnpm --filter @rampe/e2e exec playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: pnpm test:e2e
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
      - name: Stop the application
        if: always()
        run: docker compose down --volumes
