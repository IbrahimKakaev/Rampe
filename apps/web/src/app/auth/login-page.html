<h1>Se connecter</h1>

<form class="form" novalidate (submit)="submit($event)">
  @if (form.failure(); as failure) {
  <div class="alert" role="alert"><p>{{ failure }}</p></div>
  }

  <p class="form-help">Tous les champs sont obligatoires.</p>

  <div class="field">
    <label for="email">Adresse e-mail</label>
    <input
      id="email"
      name="email"
      type="email"
      autocomplete="email"
      [attr.aria-invalid]="form.errors().email ? true : null"
      [attr.aria-describedby]="form.errors().email ? 'email-erreur' : null"
    />
    @if (form.errors().email; as message) {
    <p id="email-erreur" class="field-error">{{ message }}</p>
    }
  </div>

  <div class="field">
    <label for="password">Mot de passe</label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      [attr.aria-invalid]="form.errors().password ? true : null"
      [attr.aria-describedby]="form.errors().password ? 'password-erreur' : null"
    />
    @if (form.errors().password; as message) {
    <p id="password-erreur" class="field-error">{{ message }}</p>
    }
  </div>

  <div class="actions">
    <button type="submit" class="button" [attr.aria-disabled]="form.pending() ? true : null">
      Se connecter
    </button>
    <a [routerLink]="paths.forgotPassword">Mot de passe oublié ?</a>
  </div>
</form>

<p>Pas encore de compte ? <a [routerLink]="paths.register">Créer un compte</a></p>
