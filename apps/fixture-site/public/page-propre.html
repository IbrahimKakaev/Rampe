<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page sans erreur — Site de test de Rampe</title>
  </head>
  <body>
    <main>
      <h1>Page sans erreur</h1>
      <p>Cette page ne contient aucune erreur que les tests automatiques puissent détecter.</p>
      <img
        src="data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%2240%22%3E%3Crect width=%22160%22 height=%2240%22 fill=%22%230b3d91%22/%3E%3C/svg%3E"
        width="160"
        height="40"
        alt="Logo de l'entreprise"
      />
      <form action="/" method="get">
        <label for="nom">Votre nom</label>
        <input type="text" id="nom" name="nom" autocomplete="name" />
        <button type="submit">Envoyer</button>
      </form>
      <p><a href="/">Retour à l'accueil</a></p>
    </main>
  </body>
</html>
